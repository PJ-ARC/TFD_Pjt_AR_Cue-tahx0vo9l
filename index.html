<!doctype html>
<html>
<head>    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <style>
        .ui {
            position: absolute;
            z-index: 100;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 10px 15px 30px;
            text-align: center;
            box-sizing: border-box;
        }
        .ui a {
            display: inline-block;
            width: 60px;
            height: 60px;
            background-color: #ffffff;
            line-height: 100%;
            color: #303030;
            margin: 10px 3px;
            border-radius: 50%;
            position: relative;
        }
        .ui a img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
        }
        .ui a:active {
            color: #ff0000;
        }
        #snap {
            max-width: 100%;
            height: auto;
            display: block;
            visibility: hidden;
        }
        .ui a.disabled {
            pointer-events: none;
            color: #cccccc;
        }
        #snap.visible {
            visibility: visible;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene
        vr-mode-ui="enabled: false;"
        loading-screen="enabled: false;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        id="scene"
        embedded
        gesture-detector
    >
        <a-marker
            id="animated-marker"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
            id="markerA"
        >
            <a-image
                src="assets/asset.png"
                scale="3 3 1"
                class="clickable"
                rotation="-90 0 0"
                position="1 0 0"
                gesture-handler
            ></a-image>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <div class="ui">
        <a href="#" id="take-photo" title="Take Photo"><img src="assets/camera.png" alt="Take Photo"></a>
    </div>
</body>

<script>
    var take_photo_btn = document.querySelector('#take-photo');
    var snapshotCounter = 1;  // 数字カウンター

    take_photo_btn.addEventListener("click", function (e) {
        e.preventDefault();
        var video = document.querySelector('video');
        var snap = takeSnapshot(video);
        downloadSnapshot(snap);
        resetCamera();
    });

    function takeSnapshot(video) {
        var canvas = document.createElement("canvas");
        var context = canvas.getContext("2d");
        var width = video.videoWidth;
        var height = video.videoHeight;
        canvas.width = width;
        canvas.height = height;
        context.drawImage(video, 0, 0, width, height);
        return canvas.toDataURL('image/png');
    }

    function downloadSnapshot(dataUrl) {
        var a = document.createElement('a');
        a.href = dataUrl;
        var now = new Date();
        var filename = `que-tah_${now.toISOString().replace(/[:.]/g, "_")}_${snapshotCounter}.png`;
        a.download = filename;
        snapshotCounter++;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function resetCamera() {
        var image = document.querySelector('#snap');
        image.setAttribute('src', "");
        image.classList.remove('visible');
    }
</script>
</html>
