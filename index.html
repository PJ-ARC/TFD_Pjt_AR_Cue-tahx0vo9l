<!doctype html>
<html>
<head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@latest/aframe/build/aframe-ar.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <style>
        .ui {
            position: absolute;
            z-index: 100;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 10px 15px 30px;
            text-align: center;
            box-sizing: border-box;
        }
        .ui button {
            width: 60px;
            height: 60px;
            background-color: #ffffff;
            color: #303030;
            margin: 10px 3px;
            border-radius: 50%;
            border: none;
            position: relative;
        }
        .ui button img {
            width: 30px;
            height: 30px;
        }
        #snap {
            max-width: 100%;
            height: auto;
            display: block;
            visibility: hidden;
        }
        #snap.visible {
            visibility: visible;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene
        vr-mode-ui="enabled: false;"
        loading-screen="enabled: false;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        id="scene"
        embedded
        gesture-detector
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true;"
        screenshot="width: 1920; height: 1080;">
        <a-marker
            id="markerA"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;">
            <a-image
                src="assets/asset.png"
                scale="3 3 1"
                class="clickable"
                rotation="-90 0 0"
                position="1 0 0"
                gesture-handler>
            </a-image>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <div class="ui">
        <button id="take-photo" title="Take Photo"><img src="assets/camera.png" alt="Take Photo"></button>
    </div>
</body>

<script>
    var takePhotoBtn = document.querySelector('#take-photo');
    var snapshotCounter = 1;

    // スナップショット取得処理
    function takeSnapshot() {
        var scene = document.querySelector("a-scene");
        if (!scene || !scene.components.screenshot) {
            alert("カメラの準備ができていません。少し待ってから試してください。");
            return;
        }

        // スクリーンショットを取得
        var sceneCanvas = scene.components.screenshot.getCanvas("perspective");
        if (!sceneCanvas) {
            alert("スナップショットの取得に失敗しました。");
            return;
        }

        var dataUrl = sceneCanvas.toDataURL('image/png');
        downloadSnapshot(dataUrl);
    }

    // スナップショットをダウンロード
    function downloadSnapshot(dataUrl) {
        var a = document.createElement('a');
        a.href = dataUrl;
        var now = new Date();
        var filename = `snapshot_${now.toISOString().replace(/[-:]/g, "").split(".")[0]}_${snapshotCounter}.png`;
        a.download = filename;
        snapshotCounter++;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // ボタン押下でスナップショットを撮る
    takePhotoBtn.addEventListener("click", function (e) {
        e.preventDefault();
        setTimeout(() => {
            takeSnapshot();
        }, 500); // 500ms 待機してから撮影
    });

    // ページ読み込み時のカメラアクセスチェック
    async function checkCameraAccess() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            stream.getTracks().forEach(track => track.stop());
            console.log("カメラアクセス成功");
        } catch (err) {
            alert("カメラにアクセスできません。設定を確認してください。");
            console.error("カメラアクセスエラー:", err);
        }
    }

    window.onload = checkCameraAccess;
</script>
</html>
